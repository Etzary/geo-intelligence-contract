name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      # `prepare` ya compila al instalar, pero se repite explícito para dejar el
      # artefacto (dist/) garantizado aunque cambie el script de instalación.
      - name: Compilar
        run: npm run build
